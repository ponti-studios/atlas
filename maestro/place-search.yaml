appId: io.ponti.atlas.ios
---
# Search Apple Maps for a place and save it. Needs the live search service.
# The saved place ends up in the Places list with its coordinates, which is
# what the last assertion checks — the results list shows an address instead.
- launchApp
- tapOn: "Open sidebar"
- tapOn: "Places"
- tapOn: "Search Apple Maps"
- inputText: "Eiffel Tower"
- assertVisible: ".*Avenue Anatole France.*"
- takeScreenshot: docs/design/maestro-place-results
- tapOn:
    id: "atlas.savePlace"
# The clear button's hit target is its 11pt icon, which does not register
# synthetic touches (the 44pt minimum exists for exactly this reason), so erase
# the query instead.
- eraseText: 12
- tapOn: "Search places"
- inputText: "Eiffel"
- assertVisible: "48.858, 2.294"
- takeScreenshot: docs/design/maestro-place-search
