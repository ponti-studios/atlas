name: Atlas
options:
  bundleIdPrefix: com.charlesponti
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: 3QHJ2KN8AL
    # The marketing version ships; the build number is stamped by the ship
    # pipeline (a timestamp) so every upload is higher than the last.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AtlasCore:
    path: AtlasCore
targets:
  Atlas iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    dependencies:
      - package: AtlasCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ponti.atlas.ios
        INFOPLIST_FILE: iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - AtlasTests
        - AtlasUITests
  Atlas macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOS
    dependencies:
      - package: AtlasCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ponti.atlas.macos
        INFOPLIST_FILE: macOS/Info.plist
    scheme:
      testTargets:
        - AtlasMacUITests
  AtlasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Atlas iOS
      - package: AtlasCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ponti.atlas.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Atlas iOS.app/Atlas iOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
  AtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TestsUITests
    dependencies:
      - target: Atlas iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ponti.atlas.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Atlas iOS
  AtlasMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: TestsUITests
    dependencies:
      - target: Atlas macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ponti.atlas.uitests.mac
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Atlas macOS
